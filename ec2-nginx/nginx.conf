# =============================================================================
# Skyvery - NGINX del panel de operaciones (EC2 detrás de un ALB)
# Este archivo reemplaza /etc/nginx/nginx.conf en la instancia.
#
# Requisito del proyecto: rate limiting por IP de 10 req/s con burst de 20,
# respondiendo 429 cuando se supera.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # ------------------------------------------------------------------ Logs
    # El código de estado queda rodeado de espacios, así funciona:
    #   grep " 429 " /var/log/nginx/access.log
    log_format skyvery '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'limit=$limit_req_status xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log skyvery;

    # ------------------------------------------------- IP real del cliente
    # Detrás del ALB, NGINX ve como origen la IP privada del balanceador.
    # El ALB agrega la IP real del cliente en la cabecera X-Forwarded-For.
    # Solo confiamos en esa cabecera cuando la petición viene de la red
    # privada (la VPC), que es donde vive el ALB.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------- Rate limiting
    # Zona "perip": 10 MB de memoria compartida (~160.000 IPs),
    # 10 peticiones por segundo por cada IP.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html/ops-panel;
        index index.html;

        # Health check del ALB: sin límite y sin ensuciar el log.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Panel de operaciones.
        # burst=20  -> admite una ráfaga de hasta 20 peticiones extra.
        # nodelay   -> la ráfaga se atiende de inmediato (no se encola);
        #              lo que pase de ahí recibe 429.
        location / {
            limit_req zone=perip burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # Respuesta clara cuando se supera el límite.
        error_page 429 @limite;
        location @limite {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Demasiadas peticiones: limite de 10 req/s por IP"}\n';
        }
    }
}
