AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Skyvery - Plataforma de delivery con seguimiento en tiempo real

Parameters:
  Stage:
    Type: String
    Default: prod
  NotificationEmail:
    Type: String
    Description: Email que recibe las confirmaciones de entrega (SNS)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ORDERS_TABLE: !Ref OrdersTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        DRIVER_LOCATIONS_TABLE: !Ref DriverLocationsTable
        HISTORY_TABLE: !Ref DeliveryHistoryTable
        DRIVERS_TABLE: !Ref DriversTable
        DELIVERY_TOPIC_ARN: !Ref DeliveryTopic

Resources:
  # ---------------------------------------------------------------- DynamoDB
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub skyvery-subscriptions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: orderId, AttributeType: S }
      KeySchema:
        - { AttributeName: connectionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: orderId-index
          KeySchema:
            - { AttributeName: orderId, KeyType: HASH }
          Projection: { ProjectionType: KEYS_ONLY }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub skyvery-orders-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: orderId, AttributeType: S }
        - { AttributeName: zone, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
      KeySchema:
        - { AttributeName: orderId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: zone-status-index
          KeySchema:
            - { AttributeName: zone, KeyType: HASH }
            - { AttributeName: status, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  DriverLocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub skyvery-driver-locations-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: driverId, AttributeType: S }
        - { AttributeName: geohashPrefix, AttributeType: S }
        - { AttributeName: ts, AttributeType: N }
      KeySchema:
        - { AttributeName: driverId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: geohash-index
          KeySchema:
            - { AttributeName: geohashPrefix, KeyType: HASH }
            - { AttributeName: ts, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  DeliveryHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub skyvery-delivery-history-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: orderId, AttributeType: S }
        - { AttributeName: deliveredAt, AttributeType: S }
      KeySchema:
        - { AttributeName: orderId, KeyType: HASH }
        - { AttributeName: deliveredAt, KeyType: RANGE }

  DriversTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub skyvery-drivers-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: driverId, AttributeType: S }
      KeySchema:
        - { AttributeName: driverId, KeyType: HASH }

  # --------------------------------------------------------------- SNS / S3
  DeliveryTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub skyvery-delivery-completed-${Stage}
      Subscription:
        - { Protocol: email, Endpoint: !Ref NotificationEmail }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub skyvery-frontend-${AWS::AccountId}-${Stage}
      WebsiteConfiguration: { IndexDocument: index.html }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  # ------------------------------------------------------ API REST (HTTP API)
  OrdersHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ["*"]

  OrdersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/orders_api/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Events:
        CreateOrder:
          Type: HttpApi
          Properties: { ApiId: !Ref OrdersHttpApi, Path: /orders, Method: POST }
        GetOrder:
          Type: HttpApi
          Properties: { ApiId: !Ref OrdersHttpApi, Path: /orders/{orderId}, Method: GET }
        ListByZone:
          Type: HttpApi
          Properties: { ApiId: !Ref OrdersHttpApi, Path: /zones/{zone}/orders, Method: GET }

  CompleteDeliveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/complete_delivery/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DeliveryHistoryTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DriversTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt DeliveryTopic.TopicName }
      Events:
        Complete:
          Type: HttpApi
          Properties: { ApiId: !Ref OrdersHttpApi, Path: /orders/{orderId}/complete, Method: POST }

  # ------------------------------------------------ WebSocket API (Carlos/Oskar)
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub skyvery-ws-${Stage}
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  # --- $connect
  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/ws_connect/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${WsConnectIntegration}

  # --- $disconnect
  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/ws_disconnect/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WsDisconnectIntegration}

  # --- location-update
  # La ruta, la integración y los permisos quedan listos; el código de
  # lambdas/location_update/app.py es de Oskar (conditional write + broadcast).
  LocationUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/location_update/
      Handler: app.handler
      Environment:
        Variables:
          # Endpoint para ApiGatewayManagementApi (postToConnection)
          WS_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DriverLocationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/POST/@connections/*

  LocationUpdatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LocationUpdateFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  LocationUpdateIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LocationUpdateFunction.Arn}/invocations

  LocationUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: location-update
      AuthorizationType: NONE
      Target: !Sub integrations/${LocationUpdateIntegration}

  # --- Deployment + stage
  # Ojo: CloudFormation no crea un Deployment nuevo cuando cambian las rutas.
  # Si se agrega o modifica una ruta, renombrar este recurso (p. ej. ...V2)
  # para forzar un redeploy de la API.
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WsConnectRoute
      - WsDisconnectRoute
      - LocationUpdateRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Stage
      DeploymentId: !Ref WebSocketDeployment

Outputs:
  OrdersApiUrl:
    Value: !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  WebSocketUrl:
    Description: URL para clientes y simulador (wscat -c "<url>?orderId=...")
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  WebSocketManagementEndpoint:
    Description: Endpoint de ApiGatewayManagementApi (postToConnection)
    Value: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  DeliveryTopicArn:
    Value: !Ref DeliveryTopic
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  DriverLocationsTableName:
    Value: !Ref DriverLocationsTable
