# =============================================================================
# Skyvery - NGINX del panel de operaciones (EC2 detrás de un ALB)
# Este archivo reemplaza /etc/nginx/nginx.conf en la instancia.
#
# Requisito del proyecto: rate limiting por IP de 10 req/s con burst de 20,
# respondiendo 429 cuando se supera.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
}
